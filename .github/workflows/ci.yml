name: CI

on:
  push:
    branches:
      - "master"
      - "main"
    paths-ignore:
      - "*.md"
      - "COPYING"
      - "LICENSE"
  pull_request:
    branches:
      - "master"
      - "main"
    paths-ignore:
      - "*.md"
      - "COPYING"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Set up GNU Make
        run: |
          pushd /tmp
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors 'https://ftpmirror.gnu.org/make/make-4.4.1.tar.gz' -o make-4.4.1.tar.gz
          tar xzf make-4.4.1.tar.gz
          cd make-4.4.1
          ./configure --prefix=/usr/local
          sudo make install
          popd

      - name: Set up bmakelib
        run: |
          curl -fsSL https://github.com/bahmanm/bmakelib/releases/download/v0.9.0/bmakelib-portable.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=1

      - name: Compile and test
        run: make test

      - name: Run E2E tests
        run: make VERSION=ci e2e-test

      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            bjforth/build/reports
            bjforth/build/test-results

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bjforth/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

  license_scan:
    name: License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run FOSSA analysis
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
        continue-on-error: true
